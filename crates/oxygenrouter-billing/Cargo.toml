[package]
name          = "oxygenrouter-billing"
version.workspace = true
edition.workspace = true
description   = "Billing & quota engine: ratios, token counting, quota math, settlement"

[dependencies]
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "1"
rust_decimal = { version = "1", features = ["serde"] }
# tiktoken-rs pulls its BPE tables at build time and needs the network the first
# time; keep it optional so the engine still builds in an offline environment
# (the estimator fallback remains available).
tiktoken-rs = { version = "0.12", optional = true }
once_cell    = "1"
parking_lot  = "0.12"

oxygenrouter-core = { path = "../oxygenrouter-core" }

[features]
default = ["tiktoken"]
tiktoken = ["dep:tiktoken-rs"]
