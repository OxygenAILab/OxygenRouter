[package]
name          = "oxygenrouter"
version.workspace = true
edition.workspace = true
description   = "OxygenRouter CLI binary"
default-run   = "oxygenrouter"

[[bin]]
name = "oxygenrouter"
path = "src/main.rs"

[dependencies]
tokio       = { version = "1", features = ["full"] }
axum        = { version = "0.7", features = ["macros"] }
tower-http   = { version = "0.5", features = ["cors"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
parking_lot  = "0.12"
chrono      = { version = "0.4", features = ["serde"] }
anyhow      = "1"

oxygenrouter-core  = { path = "../oxygenrouter-core" }
oxygenrouter-proxy = { path = "../oxygenrouter-proxy" }
oxygenrouter-webui = { path = "../oxygenrouter-webui", features = ["embed-webui"] }

[target.'cfg(windows)'.dependencies]
# open browser on Windows
