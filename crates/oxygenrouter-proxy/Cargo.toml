[package]
name          = "oxygenrouter-proxy"
version.workspace = true
edition.workspace = true

[dependencies]
tokio       = { version = "1", features = ["full"] }
reqwest     = { version = "0.12", features = ["json", "stream"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
futures-util = "0.3"
bytes       = "1"
url         = "2"

oxygenrouter-core = { path = "../oxygenrouter-core" }
oxygenrouter-relay = { path = "../oxygenrouter-relay" }
