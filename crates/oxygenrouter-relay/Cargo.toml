[package]
name          = "oxygenrouter-relay"
version.workspace = true
edition.workspace = true
description   = "Provider adapter layer: wire-format conversion + SSE translation"

[dependencies]
tokio        = { version = "1", features = ["full"] }
reqwest      = { version = "0.12", features = ["json", "stream"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "1"
futures-util = "0.3"
bytes        = "1"
url          = "2"
async-trait  = "0.1"
regex        = "1"
hmac         = "0.12"
sha2         = "0.10"
hex          = "0.4"
chrono       = { version = "0.4", features = ["serde"] }
base64       = "0.22"

oxygenrouter-core = { path = "../oxygenrouter-core" }
