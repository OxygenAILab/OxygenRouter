[workspace]
resolver = "2"
members = [
    "crates/oxygenrouter-core",
    "crates/oxygenrouter-billing",
    "crates/oxygenrouter-proxy",
    "crates/oxygenrouter-relay",
    "crates/oxygenrouter-plugin",
    "crates/oxygenrouter-webui",
    "crates/oxygenrouter-bin",
]

[workspace.package]
version     = "0.1.0-alpha.1"
edition     = "2021"
authors     = ["OxygenAILab"]
license     = "MIT"
homepage    = "https://github.com/OxygenAILab/OxygenRouter"
repository  = "https://github.com/OxygenAILab/OxygenRouter"
description = "OpenAI-compatible API gateway with channel rotation, model routing, and WebUI"
rust-version = "1.75"

[workspace.metadata.release]
sign-commit = true

# The development host is disk- and pagefile-constrained: a full-debug build of
# the dependency graph costs gigabytes on C:, and rustc mmapping that much
# metadata fails with "the paging file is too small" before it can even compile.
# Line tables keep panic locations and `backtrace` frames useful while cutting
# what rustc must map, and dependencies need no debug info at all because they
# are not the code under test.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false
